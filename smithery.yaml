startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - xclipseUrl
      - xclipseApiKey
    properties:
      xclipseUrl:
        type: string
        title: WordPress Site URL
        description: Your WordPress site base URL (e.g. https://example.com)
      xclipseApiKey:
        type: string
        title: Xclipse MCP API Key
        description: API key generated by the xclipse-mcp-api WordPress plugin
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['mcp-server/src/index.js'],
      env: {
        XCLIPSE_URL: config.xclipseUrl,
        XCLIPSE_API_KEY: config.xclipseApiKey,
      },
    })
